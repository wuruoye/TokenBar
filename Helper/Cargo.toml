[package]
name = "tokenbar-helper"
version = "0.1.0"
edition = "2021"
description = "Local Codex, Claude Code, Grok, and Antigravity activity parser for TokenBar"
license = "MIT"
repository = "https://github.com/wuruoye/TokenBar"
publish = false

[dependencies]
chrono = "0.4"
iana-time-zone = "0.1"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
